services:
  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: fsm_sql_server_container
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=Fsm12345
      - MSSQL_PID=Express
    ports:
      - "1433:1433"  
    volumes:
      - fsm_sql_data:/var/opt/mssql  

  redis:
    image: redis:latest
    container_name: fm_redis_container
    ports:
      - "6377:6379"
    volumes:
      - redis_data:/data

volumes:
  fsm_sql_data:
    driver: local
  redis_data:
    driver: local