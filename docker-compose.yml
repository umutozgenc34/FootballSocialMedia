services:
  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: fsm_sql_server_container
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=Fsm12345
      - MSSQL_PID=Express
    ports:
      - "1433:1433"  
    volumes:
      - fsm_sql_data:/var/opt/mssql  

  redis:
    image: redis:latest
    container_name: fm_redis_container
    ports:
      - "6377:6379"
    volumes:
      - redis_data:/data
  rabbitmq:
    image: rabbitmq:3-management
    container_name: fsm_rabbitmq_container
    environment:
      - RABBITMQ_DEFAULT_USER=Fsm12345
      - RABBITMQ_DEFAULT_PASS=Fsm12345
    ports:
      - "5672:5672"    
      - "15672:15672"  
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

  mongodb:
    image: mongo:latest
    container_name: new_fsm_mongo_container
    environment:
      - MONGO_INITDB_ROOT_USERNAME=admin
      - MONGO_INITDB_ROOT_PASSWORD=Fsm12345
    ports:
      - "27018:27017"
    volumes:
      - new_mongo_data:/data/db

  mongo-express:
    image: mongo-express
    container_name: new_fsm_mongo_express_container
    environment:
      - ME_CONFIG_MONGODB_ADMINUSERNAME=admin
      - ME_CONFIG_MONGODB_ADMINPASSWORD=Fsm12345  
      - ME_CONFIG_MONGODB_SERVER=new_fsm_mongo_container 
      - ME_CONFIG_MONGODB_ENABLE_ADMIN=true
      - ME_CONFIG_MONGODB_AUTH_DATABASE=admin
    depends_on:
      - mongodb  
    ports:
      - "8082:8081"   

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.12.0
    container_name: fsm_elasticsearch_container
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
    ports:
      - "9200:9200"
      - "9300:9300"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data

  kibana:
    image: docker.elastic.co/kibana/kibana:8.12.0
    container_name: fsm_kibana_container
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    depends_on:
      - elasticsearch
    ports:
      - "5601:5601"     

volumes:
  fsm_sql_data:
    driver: local
  redis_data:
    driver: local
  rabbitmq_data:
    driver: local
  new_mongo_data:
    driver: local  
  elasticsearch_data:
    driver: local      